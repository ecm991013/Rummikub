services:
  - type: web
    name: rummikub-online
    runtime: node
    plan: free
    buildCommand: unzip -o RRummikub_Online_Atril_Libre.zip -d . && cd Rummikub_Online && npm install
    startCommand: cd Rummikub_Online && npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
