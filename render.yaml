services:
  - type: web
    name: Rummikub
    runtime: node
    plan: free
    buildCommand: unzip -o Rummikub.zip -d . && cd Rummikub_Online && npm install
    startCommand: cd Rummikub_Online && npm start
    healthCheckPath: /api/ping
    envVars:
      - key: NODE_ENV
        value: production
